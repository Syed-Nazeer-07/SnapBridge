<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>SnapFlow — select region</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font:13px "Segoe UI",sans-serif;user-select:none;background:#111;color:white;cursor:crosshair}#screen{position:fixed;width:100vw;height:100vh;object-fit:fill;pointer-events:none}#selection{position:fixed;border:1px solid #ffffff;box-shadow:0 0 0 99999px #09071088;min-width:2px;min-height:2px;cursor:move}#selection::after{content:"";position:absolute;width:10px;height:10px;background:#ffffff;border:2px solid #111111;right:-5px;bottom:-5px;cursor:nwse-resize}#handle{position:absolute;width:20px;height:20px;right:-10px;bottom:-10px;cursor:nwse-resize}#hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffffffed;border:1px solid #dedede;padding:12px 19px;border-radius:10px;color:#111;pointer-events:none;box-shadow:0 5px 30px #0007}#actions{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dedede;padding:9px 12px;border-radius:10px;cursor:default}button{border:0;border-radius:6px;font:inherit;padding:9px 13px;cursor:pointer;background:#111111;color:#ffffff}button:last-child{background:#444444;color:white}#dimensions{font-size:11px;color:#555555;min-width:90px}button:disabled{opacity:.4}[hidden]{display:none!important}
</style></head><body><img id="screen" alt="Screen being captured"><div id="selection" hidden><div id="handle"></div></div><div id="hint">Drag to select a region · Move or resize your selection · Enter to capture · Esc to cancel</div><div id="actions" hidden><span id="dimensions"></span><button id="confirm">Capture region ↵</button><button id="cancel">Cancel</button></div><script src="capture.js"></script></body></html>
