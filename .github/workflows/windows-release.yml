name: Build SnapFlow installers
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  SNAPFLOW_EXTENSION_IDS: ${{ vars.SNAPFLOW_EXTENSION_IDS }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run typecheck && npm test
      - run: npm run native:build && npm run test:native
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:desktop
      - run: xvfb-run -a npm run test:adapters
      - run: xvfb-run -a npm run test:extension
  windows:
    needs: checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      SNAPFLOW_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run typecheck && npm test
      - run: npm run native:build
      - if: matrix.arch == 'x64'
        run: npm run test:native
      - run: node scripts/dist-windows.mjs ${{ matrix.arch }} --package-only
      - name: Test installed application and native registration
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Package extension for store review
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path dist/extension/* -DestinationPath "release/SnapFlow-extension-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SnapFlow-Windows-${{ matrix.arch }}
          path: |
            release/SnapFlow-Setup-*.exe
            release/SnapFlow-extension-*.zip
          if-no-files-found: error
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SnapFlow-Windows-*
          path: downloads
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" downloads/* --title "SnapFlow $RELEASE_TAG" --notes 'Windows installers: choose arm64 for Windows on ARM (including Apple Silicon Windows VMs), or x64 for Intel/AMD PCs. Light interface, shortcut setup, instant/adjustable capture, and attach-and-prepare without automatic submission. The installer registers Native Messaging with Chrome and Edge. The companion extension is a preview awaiting store publication; Developer mode is still required until store approval. Captures are retained after preparation. Installers are unsigned. Live authenticated website compatibility and ARM hardware execution remain to be validated.'
